name: Build Plugin

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Java ${{ matrix.java }} / ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: paper-1.21.x-compatible
            java: 21
            target_java: 21
            paper_api: 1.21.11-R0.1-SNAPSHOT

          - name: newest-paper
            java: 25
            target_java: 25
            paper_api: 26.1.2.build.+

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          check-latest: true
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build jar
        run: >
          ./gradlew clean build --no-daemon --refresh-dependencies
          -PtargetJava=${{ matrix.target_java }}
          -PpaperApiVersion=${{ matrix.paper_api }}

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: NoBreakCrops-${{ matrix.name }}-java${{ matrix.target_java }}
          path: build/libs/*.jar
